<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEC-47 Evidence Review</title>
<style>
:root{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#172435;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:#132b45;color:white;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}
header h1{font-size:20px;margin:0}header p{margin:2px 0 0;color:#c8d9e8;font-size:13px}.badge{border-radius:20px;background:#315674;padding:6px 11px;font-size:12px}
main{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 83px)}aside{background:white;border-right:1px solid #d9e0e6;display:flex;flex-direction:column;max-height:calc(100vh - 83px)}
.filters{padding:16px;border-bottom:1px solid #e5e9ee;display:grid;gap:8px}.filters input,.filters select{width:100%;border:1px solid #cad3dc;border-radius:7px;padding:9px;background:white}
#list{overflow:auto;flex:1}.item{width:100%;border:0;border-bottom:1px solid #eef0f3;background:white;text-align:left;padding:11px 16px;display:block;color:#172435}.item:hover,.item.active{background:#eaf2f7}.item strong{font-size:12px;color:#1d5a83}.item small{display:block;color:#576879;margin-top:3px}.item .state{float:right;color:#8a5c18;font-size:11px}
article{padding:24px 30px;overflow:auto;max-height:calc(100vh - 83px)}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px}.topline h2{margin:0;font-size:22px}.priority{font-size:12px;border-radius:12px;padding:3px 8px;background:#e7eef5;color:#254661}.muted{color:#526477}.panel{background:white;border:1px solid #dbe2e8;border-radius:10px;padding:16px 18px;margin:16px 0;box-shadow:0 1px 2px #1724350b}.panel h3{margin:0 0 10px;font-size:16px}.panel p{margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.agent{border:1px solid #dbe2e8;border-radius:8px;padding:13px;background:#fbfcfd}.agent h4{margin:0 0 8px}.agent dl{display:grid;grid-template-columns:82px 1fr;gap:5px;margin:0}.agent dt{color:#647486}.agent dd{margin:0;overflow-wrap:anywhere}.excerpt{white-space:pre-wrap;background:#f3f7fa;border-left:3px solid #5484a6;padding:10px 12px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e1e6ea;text-align:left;padding:7px;vertical-align:top}th{color:#4c6070}code{overflow-wrap:anywhere;font-size:12px}.warning{background:#fff6e5;border-left:3px solid #d79725;padding:9px 12px}.good{color:#0e6d47}.pending{color:#8a5c18}
label{display:block;font-weight:600;margin:11px 0 4px}input,select,textarea{width:100%;border:1px solid #c7d1da;border-radius:7px;padding:9px;background:white}textarea{min-height:85px}.check{display:flex;align-items:flex-start;gap:8px;font-weight:400}.check input{width:auto;margin-top:4px}.save{background:#155e8a;color:white;border:0;border-radius:7px;padding:10px 18px;font-weight:600}.save:hover{background:#0d4b70}#message{margin-left:12px;font-weight:600}.pill{display:inline-block;border-radius:12px;background:#eef3f6;padding:3px 8px;margin:3px;font-size:12px}a{color:#146691}
@media(max-width:850px){main{display:block}aside{max-height:260px;border-right:0;border-bottom:1px solid #d9e0e6}article{max-height:none;padding:18px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>SEC-47 Evidence Review</h1><p>Frozen questions · verified SEC sources · human decisions only</p></div><span class="badge" id="progress">Loading…</span></header>
<main><aside><div class="filters"><input id="search" placeholder="Search ID, issuer or question" aria-label="Search questions"><select id="filter"><option value="all">All questions</option><option value="priority">Priority cases</option><option value="pending">Pending only</option><option value="reviewed">Reviewed only</option></select><div class="muted" id="issuerCoverage"></div></div><div id="list"></div></aside>
<article id="detail"><p>Loading review records…</p></article></main>
<script>
let data=null,selected=null;
const $=id=>document.getElementById(id);
function node(tag,text='',className=''){const e=document.createElement(tag);e.textContent=text;if(className)e.className=className;return e}
function add(parent,tag,text='',className=''){const e=node(tag,text,className);parent.append(e);return e}
function fill(parent,values){parent.replaceChildren();for(const value of values)parent.append(value)}
function current(){return data.records.find(r=>r.question_id===selected)}
function count(){const done=Object.keys(data.reviews).length;$('progress').textContent=`${done} / ${data.question_count} reviewed · ${data.question_count-done} pending`;const by={};for(const r of data.records){(by[r.ticker]??={total:0,done:0}).total++;if(data.reviews[r.question_id])by[r.ticker].done++}$('issuerCoverage').textContent=Object.entries(by).map(([k,v])=>`${k} ${v.done}/${v.total}`).join(' · ')}
function list(){const term=$('search').value.toLowerCase(),filter=$('filter').value,wrap=$('list');wrap.replaceChildren();for(const r of data.records){const reviewed=!!data.reviews[r.question_id];if(filter==='priority'&&r.priority>1||filter==='pending'&&reviewed||filter==='reviewed'&&!reviewed)continue;if(!`${r.question_id} ${r.ticker} ${r.question}`.toLowerCase().includes(term))continue;const b=add(wrap,'button','',`item${selected===r.question_id?' active':''}`);b.type='button';add(b,'strong',`${r.question_id} · ${r.ticker}`);add(b,'span',reviewed?'Reviewed':'Pending','state');add(b,'small',r.question);b.onclick=()=>{selected=r.question_id;list();detail()}}}
function field(parent,label,value){const dt=add(parent,'dt',label);const dd=add(parent,'dd',String(value||'—'));return [dt,dd]}
function detail(){const r=current(),wrap=$('detail');if(!r)return;wrap.replaceChildren();const top=add(wrap,'div','','topline');add(top,'h2',r.question_id);add(top,'span',r.priority<=1?'Priority review':r.source_evidence_level,'priority');add(wrap,'p',r.question);add(wrap,'p',`${r.ticker} · ${r.form} · report period ${r.report_date} · accession ${r.accession}`,'muted');const source=add(wrap,'section','','panel');add(source,'h3','Verified SEC source');const link=add(source,'a',r.source_url);link.href=r.source_url;link.target='_blank';link.rel='noopener noreferrer';add(source,'p',`SHA-256: ${r.source_sha256}`,'muted');add(source,'p',r.source_excerpt,'excerpt');if(r.question_validity_flag)add(source,'p','Question wording requires explicit validity review.','warning');
if(r.ai_technical_label){const proposal=add(wrap,'section','','panel');add(proposal,'h3',`G3T AI proposal: ${r.ai_technical_label}`);add(proposal,'p',r.ai_reason);add(proposal,'p',r.ai_limitation,'warning');add(proposal,'p','AI source review only. A real reviewer must inspect and decide independently.','muted')}
const comparison=add(wrap,'section','','panel');add(comparison,'h3','Independent AI submissions');const grid=add(comparison,'div','','grid');for(const [name,decision,value,locator,proposals] of [['Agent 1',r.agent1_decision,r.agent1_value,r.agent1_locator,r.agent1_proposed_cells],['Agent 2',r.agent2_decision,r.agent2_value,r.agent2_locator,r.agent2_proposed_cells]]){const card=add(grid,'div','','agent');add(card,'h4',`${name}: ${decision}`);const dl=add(card,'dl');field(dl,'Value(s)',value);field(dl,'Locator',locator);if(proposals?.length){const table=add(card,'table');const h=add(table,'tr');for(const title of ['Period','Value','Unit'])add(h,'th',title);for(const c of proposals){const row=add(table,'tr');add(row,'td',c.column_header||c.period_label||'');add(row,'td',String(c.exact_value??c.numeric_value??''));add(row,'td',`${c.currency||''} ${c.scale||''}`)}}}add(comparison,'p',`Cell comparison: ${r.cell_relation}. ${r.review_reason}`);if(r.coordinator_recommendation)add(comparison,'p',`Coordinator recommendation: ${r.coordinator_recommendation}`,'warning');
const cells=add(wrap,'section','','panel');add(cells,'h3',`Candidate source cells (${r.candidate_cells.length})`);if(!r.candidate_cells.length){add(cells,'p','No numeric cell candidate in this review record. Inspect the source passage and question wording.','muted')}else{const table=add(cells,'table');const tr=add(table,'tr');for(const h of ['Row / scope','Period','Value / unit','Evidence level / XPath'])add(tr,'th',h);for(const c of r.candidate_cells){const row=add(table,'tr');add(row,'td',`${c.row||''} · ${c.scope||''}`);add(row,'td',c.period||'');add(row,'td',`${c.value_as_printed||''} ${c.currency||''} ${c.scale||''}`);add(row,'td',`${c.source_evidence_level} · ${c.source_locator||''}`)}}
const panel=add(wrap,'section','','panel');add(panel,'h3','Human decision');const existing=data.reviews[r.question_id];if(existing)add(panel,'p',`Latest saved event: ${existing.decision} by ${existing.reviewer} at ${existing.reviewed_utc}`,'good');else add(panel,'p','No human decision saved. AI agreement is not approval.','pending');const form=add(panel,'form');const lab=(title,element)=>{const l=add(form,'label',title);l.append(element);return element};const reviewer=lab('Your name or reviewer ID',node('input'));reviewer.required=true;reviewer.maxLength=120;const decision=lab('Decision',node('select'));for(const value of ['','APPROVE','REJECT','AMBIGUOUS','REQUEST_CORRECTION','EXCLUDE']){const option=node('option',value||'Choose a decision');option.value=value;decision.append(option)}decision.required=true;const reason=lab('Rationale (at least 12 characters)',node('textarea'));reason.required=true;reason.minLength=12;const ref=lab('Evidence URL or exact source locator',node('input'));ref.required=true;ref.value=r.source_url;const erratum=r.question_validity_flag?lab('Erratum ID if this question is approved for release',node('input')):null;const check=add(form,'label','','check');const ack=node('input');ack.type='checkbox';ack.required=true;check.append(ack,node('span','I personally reviewed the source and am recording my own decision.'));const button=add(form,'button','Save review event','save');button.type='submit';const message=add(form,'span','','');message.id='message';form.onsubmit=async e=>{e.preventDefault();message.textContent='Saving…';try{const payload={question_id:r.question_id,decision:decision.value,reviewer:reviewer.value,explanation:reason.value,evidence_reference:ref.value,erratum_id:erratum?.value||'',evidence_sha256:data.evidence_sha256,human_interaction_ack:ack.checked};const response=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw Error(result.error||'Save failed');data.reviews[r.question_id]=result;count();list();detail()}catch(error){message.textContent=error.message;message.className='warning'}}}
async function start(){try{const response=await fetch('/api/questions');if(!response.ok)throw Error('Review service unavailable');data=await response.json();selected=data.records[0]?.question_id;count();list();detail()}catch(error){$('detail').textContent=error.message}}
$('search').oninput=list;$('filter').onchange=list;start();
</script>
</body></html>
