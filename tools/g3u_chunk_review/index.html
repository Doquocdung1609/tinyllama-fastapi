<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G3U Blind Chunk Review</title>
<style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#172235;background:#f5f7fb}header,.card{background:white;border:1px solid #d8deea;border-radius:12px;padding:1rem;margin:1rem 0}h1{margin:.2rem 0}small{color:#536278}button,select,input,textarea{font:inherit;padding:.55rem;border:1px solid #9ba8ba;border-radius:6px}button{background:#133a73;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:.7rem 0}input,textarea,select{width:100%;box-sizing:border-box}textarea{min-height:100px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f8;padding:1rem;max-height:420px;overflow:auto}.row{display:flex;gap:1rem;align-items:center}.row>*{flex:1}.error{color:#a21726}</style>
<header><h1>Blind original-chunk review</h1><p>Judge this single frozen chunk. Method, rank and retrieval score are hidden. Source truth and chunk relevance are separate decisions. The queue origin is shown for clarity.</p><small id="status">Loading…</small></header>
<div class="card"><div class="row"><button id="prev">Previous</button><span id="position"></span><button id="next">Next</button></div><p><label>Priority filter <select id="filter"><option value="ALL">All</option><option value="TWELVE_SOURCE_DISPUTE">Twelve source disputes</option><option value="AMD_CORPUS_GAP">AMD corpus gaps</option><option value="PROSPECTIVE_STRATIFIED">Stratified review</option></select></label></p></div>
<div class="card" id="candidate"></div>
<script>
let data=[],current=0,total=0,queueHash='';const $=id=>document.getElementById(id);const safe=(el,value)=>{el.textContent=value??''};
async function page(index){const offset=Math.floor(index/20)*20;const priority=$('filter').value;const result=await(await fetch(`/api/candidates?offset=${offset}&limit=20&priority=${encodeURIComponent(priority)}`)).json();data=result.candidates;total=result.total;current=Math.min(index,total-1);show()}
async function load(){const health=await(await fetch('/api/health')).json();queueHash=health.queue_sha256;safe($('status'),`${health.pairs} chunk pairs · ${health.questions} questions · ${health.human_events} saved human events · identity is self-declared`);await page(0)}
function show(){const local=current%20,r=data[local],wrap=$('candidate');wrap.replaceChildren();safe($('position'),`${total?current+1:0} / ${total}`);if(!r)return;const add=(tag,value)=>{const e=document.createElement(tag);safe(e,value);wrap.append(e);return e};add('h2',`${r.question_id} · ${r.review_priority}`);add('p',r.question);add('p',`Queue origin: ${r.queue_origin||'RANKED_MIXED_ARM_BLIND_UNION'}. No retrieval metric is inferred from this review screen.`);add('p',`Original chunk ${r.chunk_id} · issuer ${r.chunk_issuer} · accession ${r.chunk_accession} · section ${r.chunk_section}`);const a=add('a','Open primary SEC source');a.href=r.source_url;a.target='_blank';a.rel='noopener noreferrer';add('pre',r.original_text);add('small',`Chunk SHA-256 ${r.original_text_sha256} · source SHA-256 ${r.source_sha256}`);const form=add('form');const field=(label,tag)=>{const l=document.createElement('label');safe(l,label);const e=document.createElement(tag);l.append(e);form.append(l);return e};const reviewer=field('Your name or reviewer ID','input');reviewer.required=true;const decision=field('Single-chunk relevance decision','select');for(const value of ['','EXACT','PARTIAL','NONE','DISPUTED','SOURCE_INSUFFICIENT']){const opt=document.createElement('option');opt.value=value;safe(opt,value||'Choose');decision.append(opt)}decision.required=true;const reason=field('Reason (at least 20 characters; cite what this chunk itself supports or lacks)','textarea');reason.required=true;const evidence=field('Exact source or chunk locator','input');evidence.value=`${r.source_url}#${r.chunk_id}`;evidence.required=true;const ack=field('I personally inspected this original chunk and made this decision','input');ack.type='checkbox';ack.required=true;ack.style.width='auto';const save=document.createElement('button');save.type='submit';safe(save,'Save genuine human event');form.append(save);const message=document.createElement('p');form.append(message);form.onsubmit=async e=>{e.preventDefault();try{const payload={question_id:r.question_id,chunk_id:r.chunk_id,decision:decision.value,reviewer:reviewer.value,reason:reason.value,evidence_reference:evidence.value,queue_sha256:queueHash,human_interaction_ack:ack.checked};const response=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw Error(result.error);safe(message,`Saved event ${result.event_id}. Total human events: ${result.human_event_count}`)}catch(err){message.className='error';safe(message,err.message)}}}
$('prev').onclick=()=>page(Math.max(0,current-1)).catch(e=>safe($('status'),e.message));$('next').onclick=()=>page(Math.min(total-1,current+1)).catch(e=>safe($('status'),e.message));$('filter').onchange=()=>page(0).catch(e=>safe($('status'),e.message));load().catch(e=>safe($('status'),e.message));
</script></html>
